<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slash Studios | Indie Game Development</title>
    <style>
        /* =========================================
           YOUR PROVIDED CSS (Slash Studios - Dark Orange Theme)
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap');

        :root {
            /* Colors */
            --vs-bg: #111111;           /* Main background */
            --vs-surface: #1e1e1e;      /* Card/Nav background */
            --vs-border: #2d2d2d;       /* Subtle structural borders */
            --vs-accent: #ff7946;       /* The signature orange */
            --vs-accent-hover: #ff5c1c; /* Darker orange for hover states */
            --vs-text: #d4d4d4;         /* Standard paragraph text */
            --vs-muted: #858585;        /* Muted/comment text */
            --vs-white: #ffffff;

            /* Fonts */
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--vs-bg);
            color: var(--vs-text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background-color: var(--vs-accent);
            color: var(--vs-bg);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--vs-white);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s ease;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--vs-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--vs-border);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--vs-accent);
        }

        .font-mono { font-family: var(--font-mono); }
        .glow-text {
            color: var(--vs-accent);
            text-shadow: 0 0 15px rgba(255, 121, 70, 0.4);
        }
        .text-accent { color: var(--vs-accent); }
        .text-muted { color: var(--vs-muted); }

        .accent-border-hover {
            background-color: var(--vs-bg);
            border: 1px solid var(--vs-border);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .accent-border-hover:hover {
            border-color: var(--vs-accent);
            box-shadow: 0 0 20px rgba(255, 121, 70, 0.15);
        }

        .btn-primary {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--vs-accent);
            color: var(--vs-bg);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 2px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--vs-accent-hover);
        }

        .btn-outline {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: transparent;
            color: var(--vs-accent);
            border: 1px solid var(--vs-accent);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 121, 70, 0.1);
        }

        .btn-outline:hover {
            background-color: var(--vs-accent);
            color: var(--vs-bg);
            box-shadow: 0 0 15px rgba(255, 121, 70, 0.4);
        }

        /* =========================================
           LAYOUT & STRUCTURAL CSS (Added for the site)
           ========================================= */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Navbar */
        .navbar {
            background-color: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--vs-border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1.25rem 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .nav-links a:hover {
            color: var(--vs-accent);
        }

        /* Sections */
        .section {
            padding: 8rem 0;
        }

        .bg-surface {
            background-color: var(--vs-surface);
            border-top: 1px solid var(--vs-border);
            border-bottom: 1px solid var(--vs-border);
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60%;
            height: 4px;
            background: var(--vs-accent);
            box-shadow: 0 0 10px rgba(255, 121, 70, 0.4);
        }

        /* Hero */
        .hero {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 121, 70, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 5rem);
            margin: 1rem 0 1.5rem;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            max-width: 650px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
        }

        /* Grid / Cards */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .game-card {
            border-radius: 4px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .game-img-placeholder {
            background: #0a0a0a;
            height: 220px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--vs-border);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border: 1px dashed var(--vs-border);
            position: relative;
            overflow: hidden;
        }

        .game-img-placeholder::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.02), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
        }

        .game-card:hover .game-img-placeholder::after {
            left: 200%;
        }

        .game-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .game-info p {
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .card-link:hover {
            text-shadow: 0 0 8px rgba(255, 121, 70, 0.5);
        }

        /* Terminal Style About Section */
        .terminal-window {
            background: var(--vs-bg);
            border: 1px solid var(--vs-border);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .terminal-header {
            background: var(--vs-surface);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--vs-border);
            display: flex;
            gap: 0.5rem;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--vs-muted);
        }
        .terminal-dot:nth-child(1) { background: #ff5f56; } /* Close */
        .terminal-dot:nth-child(2) { background: #ffbd2e; } /* Min */
        .terminal-dot:nth-child(3) { background: #27c93f; } /* Max */

        .terminal-body {
            padding: 2.5rem;
            font-family: var(--font-mono);
            color: var(--vs-text);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .terminal-prompt {
            color: #27c93f;
            margin-right: 0.5rem;
        }

        /* Footer */
        .footer {
            background-color: var(--vs-surface);
            padding: 3rem 0;
            border-top: 1px solid var(--vs-border);
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero-title { font-size: 2.5rem; }
            .hero-actions { flex-direction: column; }
            .footer-content { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>

    <nav class="navbar">

            <ul class="nav-links font-mono">
                <li><a href="games.html">./Games</a></li>

     <section>

</body>
